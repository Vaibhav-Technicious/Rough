# General
CONFIG_MAIN_STACK_SIZE=8192

# Logging
CONFIG_LOG=y
CONFIG_PRINTK=y

# GPIO
CONFIG_GPIO=y

# SPI
CONFIG_SPI=y

# LoRa
CONFIG_LORA=y

# NVS for storage
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Random
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Reboot support (if needed)
CONFIG_REBOOT=y
